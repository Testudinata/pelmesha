[project]
name = "pelmesha"
dynamic = ["version"]
authors = [
  { name="Andrew Kuzin", email="Kuzya-90@bk.ru" },
]
description = "A package for proccesing and aligning peaklist Mass-spectrometry imaging data from .imzml files"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
]

dependencies = [
  "h5py",
  "kdepy==1.1.12",
  "matplotlib==3.8.2",
  "numpy==2.3.1",
  "pandas==2.3.1",
  "pybaselines==1.1.0",
  "pyimzML==1.5.3",
  "scikit_learn==1.4.2",
  "scipy==1.16.0",
  "tqdm==4.66.2"
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
[project.optional-dependencies]
dev = [
    "torch"
]


[build-system]
requires = ["setuptools>=72", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"
[project.urls]
Homepage = "https://github.com/Testudinata/pelmesha"
Issues = "https://github.com/Testudinata/pelmesha/issues"
[tool.setuptools_scm]
version_scheme = 'no-guess-dev'
local_scheme  = 'no-local-version'
